services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lidl}
      POSTGRES_USER: ${POSTGRES_USER:-lidl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lidl}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lidl:lidl@db:5432/lidl}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASSESSMENT_MODEL: ${ASSESSMENT_MODEL:-google/gemini-3.1-flash-lite}
      ASSESSMENT_TIMEOUT_SECONDS: ${ASSESSMENT_TIMEOUT_SECONDS:-60}
      RESEARCH_BUDGET_USD: ${RESEARCH_BUDGET_USD:-5}
      SOURCE_TEXT_RETENTION_DAYS: ${SOURCE_TEXT_RETENTION_DAYS:-30}
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lidl:lidl@db:5432/lidl}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASSESSMENT_MODEL: ${ASSESSMENT_MODEL:-google/gemini-3.1-flash-lite}
      ASSESSMENT_TIMEOUT_SECONDS: ${ASSESSMENT_TIMEOUT_SECONDS:-60}
      RESEARCH_BUDGET_USD: ${RESEARCH_BUDGET_USD:-5}
      SOURCE_TEXT_RETENTION_DAYS: ${SOURCE_TEXT_RETENTION_DAYS:-30}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
